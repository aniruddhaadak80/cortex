<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="980" height="520" rx="16" fill="url(#bg3)"/>
  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f9fafb">Knowledge Graph Schema</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#9ca3af">shared `company` graph &#183; memory lives in isolated `memory_{tenant}` graphs</text>

  <!-- Person -->
  <g>
    <rect x="70" y="110" width="170" height="70" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="155" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#a5b4fc">Person</text>
    <text x="155" y="160" text-anchor="middle" font-size="11" fill="#818cf8">name &#183; role &#183; email</text>
  </g>

  <!-- Project -->
  <g>
    <rect x="400" y="100" width="180" height="74" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="490" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#86efac">Project</text>
    <text x="490" y="151" text-anchor="middle" font-size="11" fill="#4ade80">name &#183; status &#183; techStack</text>
  </g>

  <!-- System -->
  <g>
    <rect x="740" y="104" width="170" height="72" rx="12" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
    <text x="825" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#67e8f9">System</text>
    <text x="825" y="154" text-anchor="middle" font-size="11" fill="#22d3ee">name &#183; type &#183; status</text>
  </g>

  <!-- Document -->
  <g>
    <rect x="120" y="320" width="170" height="70" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="205" y="349" text-anchor="middle" font-size="16" font-weight="700" fill="#fcd34d">Document</text>
    <text x="205" y="370" text-anchor="middle" font-size="11" fill="#fbbf24">title &#183; type &#183; content</text>
  </g>

  <!-- Decision -->
  <g>
    <rect x="405" y="330" width="170" height="70" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="359" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">Decision</text>
    <text x="490" y="380" text-anchor="middle" font-size="11" fill="#f87171">title &#183; date &#183; status</text>
  </g>

  <!-- Memory (tenant graph) -->
  <g>
    <rect x="715" y="322" width="220" height="86" rx="12" fill="#1a2e05" stroke="#84cc16" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="825" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#bef264">Memory</text>
    <text x="825" y="370" text-anchor="middle" font-size="11" fill="#a3e635">episodic &#183; semantic &#183; procedural</text>
    <text x="825" y="392" text-anchor="middle" font-size="10.5" fill="#65a30d">per-tenant graph &#183; isolated</text>
  </g>

  <!-- Edges -->
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="240" y1="132" x2="396" y2="132" marker-end="url(#arr2)"/>
    <line x1="580" y1="130" x2="736" y2="132" marker-end="url(#arr2)"/>
    <line x1="155" y1="180" x2="185" y2="316" marker-end="url(#arr2)"/>
    <line x1="155" y1="180" x2="430" y2="326" marker-end="url(#arr2)"/>
    <line x1="470" y1="174" x2="480" y2="326" marker-end="url(#arr2)"/>
    <line x1="540" y1="174" x2="560" y2="326" marker-end="url(#arr2)"/>
    <line x1="812" y1="176" x2="822" y2="318" marker-end="url(#arr2)"/>
    <line x1="575" y1="360" x2="711" y2="360" marker-end="url(#arr2)" stroke-dasharray="5 4"/>
  </g>

  <!-- Edge labels -->
  <g font-size="11.5" fill="#9ca3af" font-weight="600">
    <text x="318" y="122" text-anchor="middle">WORKS_ON</text>
    <text x="658" y="121" text-anchor="middle">USES</text>
    <text x="150" y="252" text-anchor="middle">AUTHORED</text>
    <text x="330" y="240" text-anchor="middle">MADE</text>
    <text x="516" y="240" text-anchor="middle">AFFECTS</text>
    <text x="846" y="246" text-anchor="middle">DEPENDS_ON</text>
    <text x="643" y="350" text-anchor="middle" fill="#65a30d">remembers</text>
  </g>

  <!-- System-to-System dependency -->
  <g stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 895 176 Q 940 240 895 318" marker-end="url(#arr2)"/>
  </g>
  <text x="948" y="250" text-anchor="middle" font-size="10.5" fill="#22d3ee" transform="rotate(90 948 250)">DEPENDS_ON *1..N</text>

  <!-- Legend -->
  <g font-size="11.5" fill="#6b7280">
    <rect x="70" y="440" width="870" height="52" rx="10" fill="#111827" stroke="#1f2937"/>
    <circle cx="96" cy="466" r="6" fill="#6366f1"/><text x="110" y="470">shared knowledge graph</text>
    <rect x="270" y="459" width="220" height="14" rx="4" fill="none" stroke="#84cc16" stroke-dasharray="5 3"/>
    <text x="500" y="470">dashed = separate FalkorDB graph per tenant (multigraph, same instance)</text>
  </g>
</svg>
