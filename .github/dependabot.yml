version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    ignore:
    - dependency-name: "@ai-sdk/openai"
      versions: [">=2"]
    - dependency-name: zod
      versions: [">=0"]
    - dependency-name: ai
      versions: [">=0"]
